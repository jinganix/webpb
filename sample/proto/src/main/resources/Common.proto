syntax = "proto2";

package CommonProto;

option java_package = "io.github.jinganix.webpb.sample.proto.common";

import "webpb/WebpbExtend.proto";
// buf:lint:ignore IMPORT_USED_ONLY_FOR_EXTENSIONS
import "WebpbOptions.proto";

// It should be ignored by jacoco, as it is marked with @Generated
message PageablePb {
  option (m_opts).java = {annotation: '@Generated'};

  optional bool pagination = 1;
  // New style: language-agnostic constraints, rendered via
  // WebpbOptions.proto mapping (Java @Range, TS @Min/@Max, Go gte=/lte=).
  // Explicit proto presence does not imply validation; required/min/max
  // must still be declared here when needed.
  optional int32 page = 2 [(opts).opt = {valid: {min: "1", max: "1000"}}];
  optional int32 size = 3 [(opts).opt = {valid: {min: "1", max: "10"}}];
  optional string sort = 4;
}

message PagingPb {
  required int32 page = 1;
  required int32 size = 2;
  required int32 totalCount = 3;
  required int32 totalPage = 4;
}
