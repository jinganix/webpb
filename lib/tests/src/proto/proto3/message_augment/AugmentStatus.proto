syntax = "proto3";

package UserAugmentProto;

option java_package = "augment.test.user";

// Enum declared in a file that is NOT imported by the augmented (target) file.
// Augment fields may reference types declared by the augmenting file, so webpb
// must resolve them from the augment declaration site, not from the target file.
enum AugmentStatus {
  AUGMENT_UNKNOWN = 0;
  AUGMENT_ACTIVE = 1;
}

// Host-only message declared next to the augment carrier (cross-file type).
message AugmentExtraPb {
  int64 value = 1;
}
