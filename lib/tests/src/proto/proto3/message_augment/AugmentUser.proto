syntax = "proto3";

package UserAugmentProto;

option java_package = "augment.test.user";

import "webpb/WebpbExtend.proto";
import "AugmentStatus.proto";
import "User.proto";

message AugmentUserPb {
  option (m_opts).opt = {augment_of: "UserPb"};

  int64 staffId = 1000;
  string displayName = 1001;
  AugmentStatus status = 1002;
  repeated AugmentExtraPb extra = 1003;
}
