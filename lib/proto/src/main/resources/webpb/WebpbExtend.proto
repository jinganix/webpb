syntax = "proto2";

option java_package = "io.github.jinganix.webpb.utilities.descriptor";
option go_package = "github.com/jinganix/webpb/plugin/gen/webpb";

import "google/protobuf/descriptor.proto";

// file options
extend google.protobuf.FileOptions {
  optional FileOpts f_opts = 1000;
}

message FileOpts {
  optional OptFileOpts opt = 1000;
  optional JavaFileOpts java = 1001;
  optional TsFileOpts ts = 1002;
  optional GoFileOpts go = 1003;
}

message OptFileOpts {
}

message JavaFileOpts {
  optional bool gen_getter = 1000 [default = true];
  optional bool gen_setter = 1001 [default = true];
  repeated string import = 1002;
  repeated string annotation = 1003;
  repeated string field_annotation = 1004;
  repeated string repeatable_annotation = 1005;
  // Maps language-agnostic (opts).opt.valid constraints to Java annotations.
  // File-level value overrides the shared WebpbOptions.proto defaults;
  // unset templates fall back to the generator built-ins (jakarta.validation).
  // Placeholders: {{value}} for single-value constraints,
  // {{min}}/{{max}} for the size interval, {{flags}} for pattern flags.
  optional JavaValidationMapping validation = 1006;
}

// Template set for rendering FieldValidation into Java annotations.
// Example: size_template = "@Size(min = {{min}}, max = {{max}})"
// renders {min_len: 1} as "@Size(min = 1)".
message JavaValidationMapping {
  optional string required_template = 1;
  optional string not_blank_template = 2;
  optional string size_template = 3;
  optional string min_template = 4;
  optional string max_template = 5;
  optional string pattern_template = 6;
  optional string email_template = 7;
  optional string valid_template = 8;
}

message TsFileOpts {
  repeated string import = 1000;
  optional bool int64_as_string = 1001;
  optional bool auto_alias = 1002;
  optional bool default_const_enum = 1003;
  optional bool enum_auto_alias = 1004;
  optional bool enum_values_literal = 1005;
  optional bool enum_by_name = 1006;
  optional bool enum_by_value = 1007;
  optional bool enum_helpers = 1008;
  optional string enum_emit_mode = 1009;
  // Maps language-agnostic (opts).opt.valid constraints to TS decorators
  // (class-validator style by default). Same override chain as Java.
  // Placeholders: {{value}}, {{min}}/{{max}}, {{flags}}.
  optional TsValidationMapping validation = 1010;
  // Emit a framework-neutral validation descriptor per message:
  //   export const XxxValidation = { field: { minLen: 1, ... } } as const;
  // Usage sites bridge it to zod / class-validator / form libs themselves,
  // so generated code stays dependency-free (no zod/class-validator import,
  // no experimentalDecorators). Only constraints actually declared are
  // included; fields without constraints are omitted.
  optional bool validation_object = 1011 [default = false];
  // Emit class-validator decorators from `validation` templates. Default
  // false: decorators require experimentalDecorators plus the
  // class-validator dependency at the usage site.
  optional bool validation_decorators = 1012 [default = false];
}

// Template set for rendering FieldValidation into TS decorators.
// String length uses length/min_length/max_length; repeated/map size uses
// array_min_size/array_max_size. The generator picks by field cardinality.
message TsValidationMapping {
  optional string required_template = 1;
  optional string not_blank_template = 2;
  optional string length_template = 3;
  optional string min_length_template = 4;
  optional string max_length_template = 5;
  optional string array_min_size_template = 6;
  optional string array_max_size_template = 7;
  optional string min_template = 8;
  optional string max_template = 9;
  optional string pattern_template = 10;
  optional string email_template = 11;
  optional string valid_template = 12;
}

message GoFileOpts {
  repeated string import = 1000;
  optional bool int64_as_string = 1001;
  optional bool auto_alias = 1002;
  optional bool enum_auto_alias = 1003;
  // Overrides the generated Go package name (defaults to the plugin parameter).
  optional string package = 1004;
  // Maps language-agnostic (opts).opt.valid constraints to
  // go-playground/validator tag fragments joined by comma
  // into `validate:"..."`. Placeholders: {{value}}.
  optional GoValidationMapping validation = 1005;
}

// Template set for rendering FieldValidation into Go validator tag fragments.
message GoValidationMapping {
  optional string required_template = 1;
  optional string not_blank_template = 2;
  optional string min_len_template = 3;
  optional string max_len_template = 4;
  optional string min_template = 5;
  optional string max_template = 6;
  optional string pattern_template = 7;
  optional string email_template = 8;
  optional string valid_template = 9;
}

// message options
extend google.protobuf.MessageOptions {
  optional MessageOpts m_opts = 1000;
}

message MessageOpts {
  optional OptMessageOpts opt = 1000;
  optional JavaMessageOpts java = 1001;
  optional TsMessageOpts ts = 1002;
  optional GoMessageOpts go = 1003;
}

message OptMessageOpts {
  optional string method = 1001;
  optional string path = 1002;
  optional string context = 1003;
  optional string extends = 1004;
  repeated string implements = 1005;
  optional string sub_type = 1006;
  repeated string sub_values = 1007;
  optional int32 alias_reserve = 1008;
  // Merge this message's fields into the named target message at codegen time.
  // The augment message itself is not generated as a standalone type.
  optional string augment_of = 1009;
  // When true, other messages may declare augment_of targeting this message.
  optional bool open = 1010;
  // Host augment fields must use field numbers greater than this value.
  optional int32 field_reserve = 1011;
}

message JavaMessageOpts {
  repeated string annotation = 1000;
  repeated string field_annotation = 1001;
}

message TsMessageOpts {
  optional bool auto_alias = 1000;
}

message GoMessageOpts {
  optional bool auto_alias = 1000;
  // Emit a Go interface implemented by this message (for polymorphism).
  optional string implements_interface = 1001;
}

// enum options
extend google.protobuf.EnumOptions {
  optional EnumOpts e_opts = 1000;
}

message EnumOpts {
  optional OptEnumOpts opt = 1000;
  optional JavaEnumOpts java = 1001;
  optional TsEnumOpts ts = 1002;
  optional GoEnumOpts go = 1003;
}

message OptEnumOpts {
  optional bool string_value = 1000;
}

message JavaEnumOpts {
  repeated string annotation = 1000;
  repeated string implements = 1001;
}

message TsEnumOpts {
  optional bool default_const_enum = 1001;
  optional bool enum_auto_alias = 1002;
  optional bool enum_values_literal = 1003;
  optional bool enum_by_name = 1004;
  optional bool enum_by_value = 1005;
  optional bool enum_helpers = 1006;
  optional string enum_emit_mode = 1007;
}

message GoEnumOpts {
  optional bool auto_alias = 1000;
}

// field options
extend google.protobuf.FieldOptions {
  optional FieldOpts opts = 1000;
}

message FieldOpts {
  optional OptFieldOpts opt = 1000;
  optional JavaFieldOpts java = 1001;
  optional TsFieldOpts ts = 1002;
  optional GoFieldOpts go = 1003;
}

message OptFieldOpts {
  optional bool omitted = 1000;
  optional bool in_query = 1001;
  // Language-agnostic validation constraints. The generators render them
  // into per-language annotations/decorators/tags using the
  // Java/Ts/GoValidationMapping templates. Explicit proto presence
  // (e.g. `required` keyword, proto2 required vs proto3 optional) does not
  // imply validation; set valid.required explicitly when needed.
  optional FieldValidation valid = 1002;
}

// Language-agnostic field validation. min_len/max_len cover both string
// length and repeated/map size (merged by design); the generators pick the
// target spelling (@Size vs @Length/@ArrayMinSize vs min=/max=) from context.
message FieldValidation {
  optional bool required = 1;
  optional bool not_blank = 2;
  optional int64 min_len = 3;
  optional int64 max_len = 4;
  // Numeric bounds as strings so int64 and double share one schema
  // without precision loss; the Java generator picks @Min/@Max for
  // integral fields and @DecimalMin/@DecimalMax for floating point ones.
  optional string min = 5;
  optional string max = 6;
  // Regular expression without surrounding slashes.
  optional string pattern = 7;
  // Regex flags, e.g. "i" or "CASE_INSENSITIVE". Rendered via the
  // {{flags}} placeholder of the per-language pattern template.
  optional string pattern_flags = 8;
  optional bool email = 9;
  // Cascaded validation for message / repeated message fields.
  optional bool valid = 10;
}

message JavaFieldOpts {
  repeated string annotation = 1000;
  optional bool as_set = 1001;
  optional bool as_collection = 1002;
}

message TsFieldOpts {
  optional bool as_string = 1000;
  optional string alias = 1001;
  optional bool auto_alias = 1002;
}

message GoFieldOpts {
  optional bool as_string = 1000;
  optional string alias = 1001;
  optional bool auto_alias = 1002;
  // Skip the field in generated structs (e.g. handled by another message).
  optional bool omitted = 1003;
}

// enum value options
extend google.protobuf.EnumValueOptions {
  optional EnumValueOpts v_opts = 1000;
}

message EnumValueOpts {
  optional OptEnumValueOpts opt = 1000;
  optional JavaEnumValueOpts java = 1001;
  optional TsEnumValueOpts ts = 1002;
  optional GoEnumValueOpts go = 1003;
}

message OptEnumValueOpts {
  optional string value = 1000;
}

message JavaEnumValueOpts {
  repeated string annotation = 1000;
}

message TsEnumValueOpts {
}

message GoEnumValueOpts {
}
