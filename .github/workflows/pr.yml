name: PR

on:
  merge_group:
  pull_request:
    branches:
      - master

jobs:
  commit-msg:
    name: Check Commit Message
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'pull_request' || (github.event.pull_request.title != '' && !startsWith(github.event.pull_request.title, 'chore: release') && !startsWith(github.event.pull_request.title, 'chore: bump version to')) }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit messages
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.pull_request.title }}" > /tmp/pr-title.txt
            ./scripts/validate-commit-msg.sh /tmp/pr-title.txt
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            RANGE="${{ github.event.merge_group.base_sha }}..HEAD"
          fi
          for sha in $(git rev-list "$RANGE"); do
            git log -1 --pretty=format:%B "$sha" > /tmp/commit-msg.txt
            echo "--- $sha: $(head -1 /tmp/commit-msg.txt)"
            ./scripts/validate-commit-msg.sh /tmp/commit-msg.txt
          done

  build:
    name: Build
    needs: [commit-msg]
    if: always() && (needs.commit-msg.result == 'success' || needs.commit-msg.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.mod

      - name: Configure Go for Gradle
        shell: bash
        run: |
          set -euo pipefail
          GO_BIN="$(command -v go)"
          echo "WEBPB_GO=${GO_BIN}" >> "${GITHUB_ENV}"
          echo "Using Go: ${GO_BIN}"
          "${GO_BIN}" version

      - name: Build Go plugins
        shell: bash
        working-directory: plugin
        run: |
          set -euo pipefail
          ext=
          if [ "${RUNNER_OS}" = "Windows" ]; then
            ext=".exe"
          fi
          mkdir -p bin
          go build -o "bin/webpb-protoc-dump${ext}" ./cmd/webpb-dump
          go build -o "bin/webpb-protoc-go${ext}" ./cmd/webpb-go
          go build -o "bin/webpb-protoc-java${ext}" ./cmd/webpb-java
          go build -o "bin/webpb-protoc-ts${ext}" ./cmd/webpb-ts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup protoc
        shell: bash
        run: bash .github/scripts/setup-protoc.sh 27.3

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon --info -PskipGoTest=true

      - name: Install runtime/ts dependencies
        shell: bash
        working-directory: runtime/ts
        run: npm ci

      - name: Check runtime/ts
        shell: bash
        working-directory: runtime/ts
        run: npm run check

      - name: Build runtime/ts
        shell: bash
        working-directory: runtime/ts
        run: npm run build

      - name: Verify runtime/ts CLI
        shell: bash
        working-directory: runtime/ts
        run: node build/cli/bin/webpb.js generate --help

      - name: Run Go plugin tests
        if: runner.os != 'Windows'
        shell: bash
        working-directory: plugin
        run: go test ./...

      - name: Check sample frontend
        if: runner.os != 'Windows'
        working-directory: sample/frontend
        run: |
          npm ci
          npm run check
          npm run test:e2e:install:ci
          npm run test:e2e